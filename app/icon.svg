  <rect x="1" y="1" width="98" height="98" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" />
  <text
    x="50"
    y="69"
    text-anchor="middle"
    font-family="'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="44"
    font-weight="800"
    letter-spacing="-1.5"
