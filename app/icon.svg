<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Nuniversity">
  <title>Nuniversity</title>
  <defs>
    <linearGradient id="nu-brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#nu-brand)" />
