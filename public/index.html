<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<title>Nuniversity</title>
<script>
(function () {
  try {
    if (window.top !== window.self && window.top.location.href !== window.location.href) {
      window.top.location.replace(window.location.href);
      return;
    }
  } catch (e) {
    // Top window is cross-origin and refuses the top-level navigation.
  }
  if (window.top === window.self) return;
  var blank = function () {
    if (window.top !== window.self) {
      var s = document.createElement('style');
      s.textContent = 'html,body{display:none !important}';
      (document.head || document.documentElement).appendChild(s);
      var b = document.createElement('div');
      b.setAttribute('style','position:fixed;left:0;top:0;width:100%;height:100%;background:#0b1120;color:#e2e8f0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font:16px/1.5 system-ui,-apple-system,sans-serif;z-index:2147483647');
      b.textContent = 'This page must be opened directly on nuniversity.github.io (or a documented mirror).';
      (document.body || document.documentElement).appendChild(b);
    }
  };
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', blank); } else { blank(); }
})();
</script>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48"/>
<link rel="icon" href="/icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="/apple-icon.png"/>
<script>
(function () {
  var m = document.cookie.match(/NEXT_LOCALE=(en|pt|es)/)
  var n = (navigator.language || 'en').slice(0, 2)
  var locale = (m && m[1]) || (n === 'pt' ? 'pt' : n === 'es' ? 'es' : 'en')
  location.replace('/' + locale + '/')
})()
</script>
<noscript><meta http-equiv="refresh" content="0; url=/en/"/></noscript>
</head>
<body>
<noscript><p><a href="/en/">English</a> · <a href="/pt/">Português</a> · <a href="/es/">Español</a></p></noscript>
</body>
</html>
