name: Deploy static site to Pages

# Builds the static export, runs every quality gate, and deploys to GitHub
# Pages. Also runs the gates on pull requests (without deploying).
#
# Important: the build step runs `npm run build`, not `next build`. `next build`
# alone skips `prebuild` (media publishing + search index), `postbuild`
# (404 stub + CSP injection) and the `verify-css` / `verify-csp` gates, so the
# deployed artifact would differ from a local build.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Must match `engines` in package.json and .node-version.
          node-version: "22"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          # A correct glob matters: `**.[jt]s` (the previous value) matches
          # almost nothing, so stale caches were restored across source
          # changes.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Content validators
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet pytest pyyaml jsonschema
          python3 -m pytest tests -q --ignore=tests/library/test_link_exceptions.py

      - name: Course-writer validators
        # rc 1 (warnings to backfill) is tolerated; rc 2 fails the build.
        run: npm run validate:courses

      - name: Dependency audit (advisory)
        # Non-blocking: every current advisory is dev-only, build-only, or
        # requires a server runtime this static site does not have. The report
        # is kept visible so new advisories are noticed.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Build static site
        # `npm run build` = prebuild (media + search index) → next build →
        # postbuild (404 stub + CSP) → verify-css → verify-csp.
        run: npm run build

      - name: Check published size
        # GitHub Pages rejects sites over 1 GB.
        run: |
          SIZE=$(du -sb out | cut -f1)
          echo "Published output: $((SIZE/1024/1024)) MB"
          if [ "$SIZE" -gt 1000000000 ]; then
            echo "::error::out/ exceeds the 1 GB GitHub Pages limit"
            exit 1
          fi
          if [ "$SIZE" -gt 900000000 ]; then
            echo "::warning::out/ is above 900 MB — close to the GitHub Pages limit"
          fi

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
