[project]
name = "nuniversity-harness"
version = "0.1.0"
description = "Deterministic AI agentic harness for NUniversity"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.26",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-mock>=3.15",
    "bandit[toml]>=1.8.0",
    "pre-commit>=4.0",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "N",    # pep8-naming
    "RUF",  # Ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "S108", "S603", "E402", "I001"]  # Allow assert, tmp paths, subprocess, sys.path in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["scripts", "hooks"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]  # Skip assert warnings in tests
